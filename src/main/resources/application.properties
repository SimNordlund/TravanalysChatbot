spring.application.name=amortization-helper

server.port=${PORT:8081}

# The chat uses Responses API so GPT-6.1 Sol can reason while calling trav tools.
spring.ai.model.chat=none
app.openai.chat.model=gpt-6.1-sol
app.openai.chat.reasoning-effort=medium
app.openai.chat.max-output-tokens=${CHAT_MAX_OUTPUT_TOKENS:8000}
app.openai.chat.prompt-cache-key=travolta-chat-v3
app.openai.scope.model=gpt-6.1-sol
app.openai.scope.reasoning-effort=low
app.openai.scope.max-output-tokens=256

spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}

spring.ai.model.embedding=openai
spring.ai.openai.embedding.model=text-embedding-3-large

vectorstore.filepath=${VECTORSTORE_FILEPATH:temp/vectorstore.json}

logging.level.org.springframework.web.reactive.function.client.ExchangeFunctions=INFO
logging.level.org.springframework.ai=${AI_LOG_LEVEL:INFO}

spring.ai.retry.enabled=true
spring.ai.retry.max-attempts=5
spring.ai.retry.backoff.initial-interval=2s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=30s
spring.ai.retry.on-http-codes=429,502,504

logging.level.org.springframework.ai.rag=${AI_LOG_LEVEL:INFO}
logging.level.root=INFO
logging.level.org.example.amortizationhelper=INFO

# Anonymous chat sessions live in memory and expire after inactivity
app.chat.memory.session-ttl=${CHAT_MEMORY_SESSION_TTL:PT6H}
# Allow a sourced answer to finish when database and web lookups take more than 30 seconds.
spring.mvc.async.request-timeout=${CHAT_STREAM_TIMEOUT:300s}

spring.jpa.hibernate.ddl-auto=validate
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

spring.ai.model.audio.transcription=openai
spring.ai.openai.audio.transcription.options.model=gpt-4o-transcribe
spring.ai.openai.audio.transcription.options.response-format=text
spring.ai.openai.audio.transcription.options.language=sv
spring.ai.openai.audio.transcription.options.temperature=0

spring.ai.model.audio.speech=openai
spring.ai.openai.audio.speech.options.model=gpt-4o-mini-tts
spring.ai.openai.audio.speech.options.voice=ash
spring.ai.openai.audio.speech.options.response-format=wav
spring.ai.openai.audio.speech.options.speed=1

# Azure Speech
app.azure.speech.key=${AZURE_SPEECH_KEY:}
app.azure.speech.region=${AZURE_SPEECH_REGION:westeurope}
app.azure.speech.voice=${AZURE_SPEECH_VOICE:sv-SE-MattiasNeural}

spring.servlet.multipart.max-request-size=25MB
spring.servlet.multipart.max-file-size=25MB

app.openai.web-search.model=gpt-6.1-sol

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=3000
spring.mail.properties[mail.smtp.writetimeout]=5000

app.mail.from=${MAIL_FROM:${MAIL_USERNAME}}


#MCP
spring.ai.mcp.client.enabled=${MCP_CLIENT_ENABLED:true}

spring.ai.mcp.client.type=SYNC

spring.ai.mcp.client.toolcallback.enabled=false
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.request-timeout=${MCP_REQUEST_TIMEOUT:15s}

spring.ai.mcp.client.stdio.connections.weather.command=${MCP_WEATHER_COMMAND:npx}
spring.ai.mcp.client.stdio.connections.weather.args[0]=-y
spring.ai.mcp.client.stdio.connections.weather.args[1]=-p
spring.ai.mcp.client.stdio.connections.weather.args[2]=open-meteo-mcp-server
spring.ai.mcp.client.stdio.connections.weather.args[3]=open-meteo-mcp-server

